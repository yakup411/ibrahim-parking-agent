name: Ibrahim Parking Agent

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: ibrahim-parking-agent
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v5

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

  parking-agent:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Datenordner vorbereiten
        run: |
          mkdir -p data

          if [ ! -f data/coordinates_cache.json ]; then
            echo "{}" > data/coordinates_cache.json
          fi

      - name: Parkplatz-Bot starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/known_offers.json data/coordinates_cache.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Automatische Aktualisierung der Bot-Daten [skip ci]"
          git push

  # GitHub startet den Zeitplan oft nur alle paar Stunden.
  # Deshalb stößt jeder Lauf 15 Minuten nach seinem Start den nächsten an.
  # Der Zeitplan oben bleibt als Sicherheit, falls die Kette abreißt.
  naechster-lauf:
    needs: parking-agent
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Bis 15 Minuten nach Start warten und nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          start=$(date -d "$(gh api repos/$GH_REPO/actions/runs/${{ github.run_id }} --jq .run_started_at)" +%s)
          warten=$(( start + 900 - $(date +%s) ))
          if [ "$warten" -gt 0 ]; then
            echo "Warte $warten Sekunden."
            sleep "$warten"
          fi
          gh workflow run parking-agent.yml --ref main

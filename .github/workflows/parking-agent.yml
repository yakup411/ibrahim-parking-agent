name: Ibrahim Parking Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  parking-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Datenordner vorbereiten
        run: |
          mkdir -p data

          if [ ! -f data/known_offers.json ]; then
            echo "[]" > data/known_offers.json
          fi

          if [ ! -f data/coordinates_cache.json ]; then
            echo "{}" > data/coordinates_cache.json
          fi

      - name: Parkplatz-Bot starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/known_offers.json data/coordinates_cache.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Automatische Aktualisierung der Bot-Daten [skip ci]"
          git push